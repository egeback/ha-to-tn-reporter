[project]
name = "ha-to-tn-reporter"
version = "1.0.0"
description = "Home Assistant to Temperatur.nu Reporter"
authors = [{name = "User"}]
dependencies = [
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "gmqtt>=0.6.12",
]
requires-python = ">=3.12"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "respx>=0.20.0",
    "freezegun>=1.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]