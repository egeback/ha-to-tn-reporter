# Lovelace dashboard for ha-to-tn-reporter.
#
# Entity names below assume station id = "sandbyang" and the underlying HA
# sensors listed in REPORTER_SENSOR_MAPPING. Adjust if your station/sensors
# differ. All `sensor.sandbyang_*` and `sensor.sandbyang_reporter_*` entities
# are created automatically via MQTT discovery once the reporter is running
# against a configured broker.

# ---------------------------------------------------------------------------
# Variant 1: Built-in cards only (no HACS dependency).
# Paste as a new view, or wrap in a `vertical-stack` for a single column.
# ---------------------------------------------------------------------------
type: vertical-stack
cards:
  - type: glance
    title: Sandbyang → temperatur.nu
    columns: 2
    entities:
      - entity: sensor.sandbyang_temperature
        name: Rapporterat
      - entity: sensor.sandbyang_winning_sensor
        name: Vinnande sensor

  - type: history-graph
    title: Senaste dygnet — rapporterat vs alla HA-sensorer
    hours_to_show: 24
    refresh_interval: 60
    entities:
      - entity: sensor.sandbyang_temperature
        name: Rapporterat (TN)
      - entity: sensor.sbht_003c_d6d2_temperature
      - entity: sensor.sbht_003c_e566_temperature
      - entity: sensor.utomhus_hue_sensor_temperature
      - entity: sensor.utomhus_sensor_1_temperature
      - entity: sensor.utomhus_sensor_2_temperature
      - entity: sensor.utomhus_sensor_3_temperature

  - type: glance
    title: Aktuella värden per sensor
    columns: 3
    show_state: true
    entities:
      - sensor.sbht_003c_d6d2_temperature
      - sensor.sbht_003c_e566_temperature
      - sensor.utomhus_hue_sensor_temperature
      - sensor.utomhus_sensor_1_temperature
      - sensor.utomhus_sensor_2_temperature
      - sensor.utomhus_sensor_3_temperature

  - type: entities
    title: Reporter-status
    entities:
      - entity: sensor.sandbyang_reporter_status
        name: Status
      - entity: sensor.sandbyang_reporter_last_run
        name: Senaste cykel
      - entity: sensor.sandbyang_reporter_last_successful_report
        name: Senaste lyckade rapport
      - entity: sensor.sandbyang_reporter_session_success
        name: Lyckade (session)
      - entity: sensor.sandbyang_reporter_session_errors
        name: Fel (session)
      - entity: sensor.sandbyang_reporter_uptime
        name: Uptime

